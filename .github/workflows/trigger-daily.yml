name: trigger-daily-brief

# 为什么需要这个仓库：
# GitHub 免费个人账号的【私有】仓库不会触发 schedule 事件（实测 14 分钟 3 个周期 0 次运行）。
# 所以把定时器放在 public 仓库里，由它调用私有仓库的 workflow_dispatch。
# 这里不含任何业务代码，只有一次 API 调用；token 存在本仓库 Secrets 里（加密）。

on:
  schedule:
    # 01:30 UTC = 08:00 Asia/Yangon（缅甸），主 slot
    - cron: "30 1 * * *"
    # 04:30 UTC = 11:00 缅甸，兜底
    # 私有仓库里有「当天已投递则跳过」的 guard，不会重复发
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch ai-daily-engine
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::缺少 DISPATCH_TOKEN secret，见 README"
            exit 1
          fi

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/melvin688/ai-daily-engine/actions/workflows/daily.yml/dispatches" \
            -d '{"ref":"main"}')

          echo "HTTP $code"
          cat /tmp/resp.json 2>/dev/null || true

          if [ "$code" != "204" ]; then
            echo "::error::dispatch 失败（HTTP $code）——token 过期/权限不足/仓库名变更"
            exit 1
          fi
          echo "已触发 melvin688/ai-daily-engine 的 daily-brief"
